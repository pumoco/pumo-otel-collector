name: runflare-otel-collector

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTel collector config
        run: sh scripts/validate-config.sh

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [validate-config]
    steps:
      - uses: actions/checkout@v4
      - name: Build and push to Runflare
        uses: runflare/actions/build@v1
        with:
          api-key: ${{ secrets.RUNFLARE_API_KEY }}
          name: pumo-otel-collector
          dockerfile: Dockerfile
          tags: latest

  health-check:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: success()
    steps:
      - name: Wait for rollout
        run: sleep 30
      - name: Check collector health
        run: |
          echo "Verifying deployment... (manual check needed for private service)"
          echo "Deployed service: pumo-otel-collector on Runflare"
          echo "Health endpoint: http://<collector-internal>:13133/health"